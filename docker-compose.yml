services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: handoff
      POSTGRES_DB: handoff
    ports:
      - "5432:5432"
    volumes:
      - handoff_pgdata:/var/lib/postgresql/data

volumes:
  handoff_pgdata:
